name: space-invaders test

# 旁路测试：只手动触发，产物写 game-v2.gif，不动线上 game.gif。
# 验证通过后再把 .github/workflows/update-game.yml 里的旧插件替换掉。
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: h1s97x/space-invaders@v0.1.0
        with:
          source: github
          user: ${{ github.repository_owner }}
          token: ${{ github.token }}
          output: game-v2.gif
      - name: Commit test output
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add game-v2.gif
          if git diff --cached --quiet; then
            echo 'no change, skip commit'
            exit 0
          fi
          git commit -m 'test: space-invaders v0.1.0 output'
          git push
