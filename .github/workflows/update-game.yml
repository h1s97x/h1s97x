name: Space Invaders

on:
  schedule:
    - cron: '0 3 * * *'  # Daily at 3am UTC (避开 metrics.yml 的 0点)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: h1s97x/space-invaders@v0.1.0
        with:
          source: github
          user: ${{ github.repository_owner }}
          token: ${{ github.token }}
          output: game.gif
      # container action 只写一个文件，不会自己提交；这里负责提交回 profile 仓库
      - name: Commit generated GIF
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add game.gif
          if git diff --cached --quiet; then
            echo 'no change, skip commit'
            exit 0
          fi
          git commit -m 'chore: update contribution gif'
          git push
