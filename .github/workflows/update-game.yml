name: Pixel Pulverizer

on:
  schedule:
    - cron: '0 3 * * *'  # Daily at 3am UTC (避开 metrics.yml 的 0点)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pulverize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2  # 保留 2 层用于 amend 判断

      - uses: h1s97x/gh-pixel-pulverizer@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: h1s97x
          output-path: game.gif
          strategy: random
          fps: 40
          max-frame: 300
